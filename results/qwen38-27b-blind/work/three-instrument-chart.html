<figcaption><b>Three instruments, three different breaking points.</b> Perplexity starts moving at the very first step down and never stops, which makes it the most sensitive of the three &mdash; and the one that says least about whether the model still works. The empty-answer rate is exactly zero for every file down to the 2.912-bpw knee, then climbs; it catches damage a full rung above where the accuracy test can resolve anything, and costs no GPU time because it is read from transcripts already on disk. Task accuracy is flat within noise until 2.153 bpw and then falls away. <b>None of these curves is the truth on its own.</b> Every value plotted is printed in the tables above; this figure only draws them.</figcaption>
