<figure>
<svg viewBox="0 0 640 300" role="img" aria-label="Line chart of what a GPU power cap costs, plotted as per cent of the stock 350 watt setting, across caps of 350, 300 and 250 watts. Board power falls fastest, to 88.8 and then 75.2 per cent. The SM clock falls to 94.2 and then 77.9 per cent. Decode throughput falls least, to 95.0 and then 87.2 per cent. Because throughput is retained better than power is spent, energy per token improves from 4.033 joules to 3.771 and then 3.479. Every value is printed in the table beside this figure.">

<figcaption><b>Capping the board spends power faster than it costs speed.</b> <span class="chip m">meas</span> Each line is that quantity as a percentage of the stock 350&nbsp;W setting, so higher is better throughout. <b>Power falls fastest and throughput falls least</b>, and the shaded gap between them is the efficiency win &mdash; it widens as the cap bites, which is why 250&nbsp;W is a better trade than 300 rather than a worse one. <b>The dashed clock line explains the shape:</b> a cap works by lowering the SM clock, and throughput does not follow it down one-for-one because decode is partly memory-bandwidth-bound and the memory clock is untouched. Note also that <b>the stock arm never reaches its own cap</b> &mdash; 305.4&nbsp;W against a 350&nbsp;W limit &mdash; so the first 50&nbsp;W removes headroom the workload was not using. Decode only; prefill is compute-bound and would plausibly lose more. <span class="chip u">n=3</span> per arm.</figcaption>
</figure>
